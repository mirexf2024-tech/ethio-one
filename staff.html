<!doctype html>
<html lang="om"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta name="theme-color" content="#082b59"><title>Staff Workspace · Ethio One</title>
<style>
:root{--navy:#082b59;--gold:#d9a928;--ink:#132d4c;--muted:#718096;--line:#e4eaf2;--bg:#f3f6fb}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,system-ui,sans-serif}header{background:linear-gradient(110deg,#061a35,#082b59);color:white;padding:16px max(16px,calc((100vw - 1050px)/2));display:flex;justify-content:space-between;align-items:center;gap:12px}header b{color:var(--gold)}header a{color:white;text-decoration:none;font-weight:800}main{max-width:1050px;margin:25px auto;padding:0 16px}.panel,.item{background:white;border:1px solid var(--line);border-radius:17px;padding:19px;box-shadow:0 8px 25px #082b5909}.panel{margin-bottom:15px}h1{margin:0;color:var(--navy);font-size:23px}.muted{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.toolbar select,.toolbar button,input{border:1px solid var(--line);border-radius:10px;padding:10px;background:white;color:var(--ink)}button{cursor:pointer;font-weight:750;border:0;border-radius:10px;padding:10px 13px;background:var(--navy);color:white}button:disabled{opacity:.55;cursor:wait}.gold{background:var(--gold);color:#172b43}.danger{background:#fceeee;color:#9b3030}.queue{display:grid;gap:12px}.item{display:grid;gap:10px}.itemhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}.pill{background:#fff4d4;color:#715400;border-radius:99px;padding:5px 10px;font-size:11px;font-weight:800}.actions{display:flex;gap:8px;flex-wrap:wrap}.hidden{display:none!important}form{display:grid;gap:11px;max-width:420px}input{width:100%}#message{margin-top:8px;color:#9b3030}.empty{padding:40px;text-align:center;background:white;border:1px dashed #d4deea;border-radius:15px;color:var(--muted)}@media(max-width:600px){main{margin:15px auto;padding:0 12px}.panel,.item{padding:15px}header{padding:14px 12px}.itemhead{display:grid}}
</style></head><body>
<header><a href="/">Ethio <b>One</b> · Staff Workspace</a><div class="toolbar"><select id="language" aria-label="Language"><option value="om">Afaan Oromoo</option><option value="am">አማርኛ</option><option value="en">English</option></select><button id="logout" class="hidden">Logout</button></div></header>
<main><section id="login" class="panel"><h1 id="loginTitle">Hojjettootaaf seensa</h1><p class="muted" id="loginHint">Support role qabu qofa galuu danda'a.</p><form id="loginForm"><input id="identity" autocomplete="username" placeholder="Email / username / Ethio ID" required><input id="password" type="password" autocomplete="current-password" placeholder="Password" required><button id="loginButton" type="submit">Seeni</button></form><div id="message" role="status"></div></section>
<section id="workspace" class="hidden"><div class="panel"><div class="itemhead"><div><h1 id="title">Member Identity Requests</h1><p class="muted" id="note">Gaaffii mirkaneessa Ethio ID ilaali; ragaa hin mul'ifnu.</p></div><div class="toolbar"><select id="status"><option value="pending_review">Pending review</option><option value="needs_more_info">Needs more info</option><option value="verified">Verified</option><option value="rejected">Rejected</option><option value="unverified">Unverified</option></select><button id="refresh" class="gold">Refresh</button></div></div><p class="muted" id="feedback"></p></div><div id="queue" class="queue"><div class="empty">Loading…</div></div></section></main>
<script>
(()=>{const API="https://ethio-one-api.onrender.com/api/v1";const $=id=>document.getElementById(id);let access=sessionStorage.getItem("ethioOneAccessToken")||"",refreshToken=sessionStorage.getItem("ethioOneRefreshToken")||"",lang="om";const words={
om:{login:"Hojjettootaaf seensa",hint:"Support role qabu qofa galuu danda'a.",email:"Email / username / Ethio ID",password:"Password",enter:"Seeni",title:"Gaaffii mirkaneessa member",note:"Gaaffii Ethio ID qoradhu. Odeeffannoo dhuunfaa barbaachisaa hin taane hin qoodin.",logout:"Ba'i",refresh:"Haaromsi",empty:"Gaaffiin hin jiru.",verify:"Mirkaneessi",more:"Odeeffannoo dabalataa gaafadhu",reject:"Didee",reason:"Sababa gabaabaa galchi:",saved:"Murtiin galmaa'e.",denied:"Aangoon hojii kanaaf hin kennamne.",failed:"Hojii raawwachuun hin danda'amne."},
en:{login:"Staff sign in",hint:"Sign in with an assigned Support role.",email:"Email / username / Ethio ID",password:"Password",enter:"Sign in",title:"Member identity requests",note:"Review Ethio ID requests. Do not expose unnecessary personal information.",logout:"Log out",refresh:"Refresh",empty:"No requests found.",verify:"Verify",more:"Request more information",reject:"Reject",reason:"Enter a short reason:",saved:"Decision recorded.",denied:"You do not have permission for this workspace.",failed:"The action could not be completed."},
am:{login:"የሰራተኛ መግቢያ",hint:"የSupport ሚና ያላቸው ብቻ መግባት ይችላሉ።",email:"Email / username / Ethio ID",password:"Password",enter:"ግባ",title:"የአባላት መለያ ማረጋገጫ ጥያቄዎች",note:"የEthio ID ጥያቄዎችን ይመርምሩ።",logout:"ውጣ",refresh:"አድስ",empty:"ጥያቄ የለም።",verify:"አረጋግጥ",more:"ተጨማሪ መረጃ ጠይቅ",reject:"ውድቅ አድርግ",reason:"አጭር ምክንያት ያስገቡ:",saved:"ውሳኔው ተመዝግቧል።",denied:"ለዚህ ቦታ ፈቃድ የለዎትም።",failed:"እርምጃው ማጠናቀቅ አልተቻለም።"}
};const tr=k=>words[lang][k]||words.om[k];function language(v){lang=v;document.documentElement.lang=v;for(const [id,k] of [["loginTitle","login"],["loginHint","hint"],["title","title"],["note","note"],["logout","logout"],["refresh","refresh"]])$(id).textContent=tr(k);$("identity").placeholder=tr("email");$("password").placeholder=tr("password");$("loginButton").textContent=tr("enter");if(!$("workspace").classList.contains("hidden"))load().catch(showError)}
function showError(e){$("feedback").textContent=(e?.message||tr("failed"));if(e?.status===401||e?.status===403){$("workspace").classList.add("hidden");$("login").classList.remove("hidden");}}
async function renew(){if(!refreshToken)return false;const r=await fetch(API+"/auth/refresh",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({refreshToken})});const d=await r.json().catch(()=>({}));if(!r.ok||!d.accessToken||!d.refreshToken)return false;access=d.accessToken;refreshToken=d.refreshToken;sessionStorage.setItem("ethioOneAccessToken",access);sessionStorage.setItem("ethioOneRefreshToken",refreshToken);return true}
async function api(path,opts={}){const headers={"Content-Type":"application/json",...(opts.headers||{})};if(access)headers.Authorization="Bearer "+access;let r=await fetch(API+path,{...opts,headers,cache:"no-store"});if(r.status===401&&await renew()){headers.Authorization="Bearer "+access;r=await fetch(API+path,{...opts,headers,cache:"no-store"})}const d=await r.json().catch(()=>({}));if(!r.ok){const e=Error(d.error||"Request failed");e.status=r.status;throw e}return d}
function esc(v){return String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
async function load(){const data=await api("/admin/identity-verifications?status="+encodeURIComponent($("status").value));const rows=data.applications||[];$("queue").innerHTML=rows.map(u=>'<article class="item" data-id="'+esc(u.id)+'"><div class="itemhead"><b>'+esc(u.full_name||"Member")+'</b><span class="pill">'+esc(u.identity_verification_status)+'</span></div><div class="muted">Ethio ID: '+esc(u.ethio_id||"—")+' · '+esc(u.email||u.phone||"")+'</div><div class="muted">Submitted / updated: '+esc(u.identity_verification_updated_at?new Date(u.identity_verification_updated_at).toLocaleString():"—")+'</div><div class="actions"><button data-decision="verified">'+tr("verify")+'</button><button class="gold" data-decision="needs_more_info">'+tr("more")+'</button><button class="danger" data-decision="rejected">'+tr("reject")+'</button></div></article>').join("")||'<div class="empty">'+tr("empty")+'</div>'}
$("loginForm").addEventListener("submit",async e=>{e.preventDefault();$("loginButton").disabled=true;$("message").textContent="";try{const r=await fetch(API+"/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({identity:$("identity").value.trim(),password:$("password").value})});const d=await r.json().catch(()=>({}));if(!r.ok)throw Error(d.error||"Sign in failed");access=d.accessToken;refreshToken=d.refreshToken;sessionStorage.setItem("ethioOneAccessToken",access);sessionStorage.setItem("ethioOneRefreshToken",refreshToken);await load();$("login").classList.add("hidden");$("workspace").classList.remove("hidden");$("logout").classList.remove("hidden");}catch(err){$("message").textContent=err.message}finally{$("loginButton").disabled=false}});
$("queue").addEventListener("click",async e=>{const b=e.target.closest("button[data-decision]");if(!b)return;const reason=b.dataset.decision==="verified"?"":(prompt(tr("reason"))||"");if(b.dataset.decision!=="verified"&&reason.trim().length<3)return;b.disabled=true;try{await api("/admin/users/"+encodeURIComponent(b.closest(".item").dataset.id)+"/identity-verification",{method:"PATCH",body:JSON.stringify({status:b.dataset.decision,reason})});$("feedback").textContent=tr("saved");await load()}catch(err){showError(err)}finally{b.disabled=false}});
$("status").addEventListener("change",()=>load().catch(showError));$("refresh").addEventListener("click",()=>load().catch(showError));$("language").addEventListener("change",e=>language(e.target.value));$("logout").addEventListener("click",async()=>{try{if(refreshToken)await api("/auth/logout",{method:"POST",body:JSON.stringify({refreshToken})})}catch{}access="";refreshToken="";sessionStorage.removeItem("ethioOneAccessToken");sessionStorage.removeItem("ethioOneRefreshToken");$("workspace").classList.add("hidden");$("login").classList.remove("hidden");$("logout").classList.add("hidden")});language("om");if(access){load().then(()=>$("login").classList.add("hidden")).then(()=>$("workspace").classList.remove("hidden")).then(()=>$("logout").classList.remove("hidden")).catch(()=>{access="";refreshToken=""})}
})();
</script></body></html>
