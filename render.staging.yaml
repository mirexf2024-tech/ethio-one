databases:
  - name: ethio-one-social-staging-db
    databaseName: ethio_one_social_staging_db
    user: ethio_one_social_staging_db_user
    plan: free
    region: frankfurt
    postgresMajorVersion: 18

services:
  - type: web
    name: ethio-one-social-staging-api
    runtime: node
    plan: free
    region: frankfurt
    branch: feature/social-chat-boundary
    rootDir: server
    buildCommand: npm install
    preDeployCommand: node scripts/migrate.js
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: false
    envVars:
      - key: NODE_ENV
        value: staging
      - key: DATABASE_URL
        fromDatabase:
          name: ethio-one-social-staging-db
          property: connectionString
      - key: CORS_ORIGINS
        value: https://ethio-one-social-staging.onrender.com
      - key: AUTH_ENABLED
        value: "false"
      - key: PAYO_ENABLED
        value: "false"
      - key: SECURITY_ALERTS_ENABLED
        value: "false"

  - type: web
    name: ethio-one-social-staging
    runtime: static
    branch: feature/social-chat-boundary
    buildCommand: echo "Preparing isolated ETHIO ONE Social staging site"
    staticPublishPath: ./staging
    autoDeploy: false
